# GitHub Actions workflow. Copy this file to .github/workflows/release.yml to switch it on.
# Publishing a version:   git tag v0.1.1 && git push origin v0.1.1
# The logic lives in scripts/build_release.py; see docs/releasing.md.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the release files
        env:
          VOIKIT_BANNED_TERMS: ${{ secrets.VOIKIT_BANNED_TERMS }}
        run: python3 scripts/build_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xargs -a dist/RELEASE_ASSETS.txt gh release create "$GITHUB_REF_NAME" \
            --title "Voikit Agent Skills ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE_NOTES.md
