# GitHub Actions workflow. Copy this file to .github/workflows/release.yml to switch it on.
# After that, publishing a version is:   git tag v0.1.0 && git push origin v0.1.0
# The zips (voikit.zip first of all) are attached to the release, so this link always works:
#   https://github.com/voikit/agent-skills/releases/latest/download/voikit.zip

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the zips (runs the lint first)
        env:
          VOIKIT_BANNED_TERMS: ${{ secrets.VOIKIT_BANNED_TERMS }}
        run: python3 scripts/build_release.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
